<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login Basico</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .caixa {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
      width: 300px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 50%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;

    }
    button:hover {
      background: #0056b3;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="caixa">
    <h2>Login</h2>
    <form action="#" method="POST">
      <label>Usuario:</label>
      <input type="text" name="usuario" required>

      <label>Senha:</label>
      <input type="password" name="senha" required>

      <button type="submit">Entrar</button>
    </form>
  </div>

</body>
</html>
